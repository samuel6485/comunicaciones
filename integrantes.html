    <!-- PÉTALOS SAKURA -->
    <script>
        function crearPetalo() {
            const petal = document.createElement("div");
            petal.classList.add("petal");
            petal.style.left = Math.random() * window.innerWidth + "px";
            petal.style.animationDuration = (5 + Math.random() * 3) + "s";
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 8000);
        }
        setInterval(crearPetalo, 300);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const btnIntegrantes = document.querySelector("#btnIntegrantes");

            if (btnIntegrantes) {
                btnIntegrantes.addEventListener("click", (e) => {
                    e.preventDefault(); // Detiene la navegación inmediata

                    Swal.fire({
                        icon: "info",
                        title: "Integrantes",
                        text: "Por favor selecciona un integrante para ver más detalles.",
                        confirmButtonColor: "#6d0b45",
                        confirmButtonText: "Entendido"
                    }).then(() => {

                        // Ahora sí redirige automáticamente
                        window.location.href = "integrantes.html";

                    });
                });
            }

        });
    </script>
